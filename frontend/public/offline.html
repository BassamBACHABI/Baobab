<!doctype html>
<html lang="fr">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B2046" />
        <title>Hors ligne — Baobab Cargo</title>
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #071328;
                color: #f8fafc;
                font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
                padding: 24px;
            }
            .card {
                max-width: 420px;
                text-align: center;
            }
            .mark {
                width: 72px;
                height: 72px;
                border-radius: 20px;
                background: #0b2046;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 24px;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            h1 {
                font-size: 24px;
                font-weight: 800;
                margin: 0 0 12px;
            }
            p {
                color: #94a3b8;
                line-height: 1.6;
                margin: 0 0 24px;
                font-size: 15px;
            }
            button {
                background: #e56b3d;
                color: #fff;
                border: none;
                padding: 14px 28px;
                border-radius: 12px;
                font-size: 15px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
            }
            button:hover { background: #d45a2c; }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="mark">
                <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                    <ellipse cx="20" cy="14.5" rx="11" ry="6.5" fill="#E56B3D" />
                    <path d="M17 14 C16 22 14.5 27 12.5 31 L27.5 31 C25.5 27 24 22 23 14 Z" fill="#F0895F" />
                </svg>
            </div>
            <h1>Vous êtes hors ligne</h1>
            <p>
                Impossible de charger cette page pour le moment. Vérifiez votre
                connexion internet, puis réessayez. Vos données restent en
                sécurité.
            </p>
            <button onclick="location.reload()">Réessayer</button>
        </div>
    </body>
</html>
